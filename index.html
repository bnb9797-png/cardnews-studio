<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="한 줄의 주제로 인스타그램 카드뉴스를 만들고 편집하는 작업실">
  <meta name="theme-color" content="#f6f5fb">
  <title>슬라이드메이커 · 카드뉴스 스튜디오</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%23694bf4'/%3E%3Cpath d='m20 9 11 6-11 6-11-6zm-11 12 11 6 11-6M9 27l11 6 11-6' stroke='white' stroke-width='2' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
  <script src="./studio.js" defer></script>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" class="symbols" aria-hidden="true">
    <symbol id="layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Zm-9 9 9 5 9-5M3 16l9 5 9-5"/></symbol>
    <symbol id="spark" viewBox="0 0 24 24"><path d="M11 2.5 9 9l-6.5 2L9 13l2 6.5 2-6.5 6.5-2L13 9l-2-6.5ZM19 15v6m-3-3h6"/></symbol>
    <symbol id="check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="arrow" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></symbol>
    <symbol id="left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 15v5h16v-5"/></symbol>
    <symbol id="edit" viewBox="0 0 24 24"><path d="m13 6 5 5M4 20l5-1L20 8a2 2 0 0 0-4-4L5 15l-1 5Z"/></symbol>
    <symbol id="grid" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 9h16m-8 0v11"/></symbol>
    <symbol id="square" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></symbol>
  </svg>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand"><span class="brand-icon"><svg><use href="#layers"/></svg></span><span>슬라이드메이커<small>CAROUSEL STUDIO</small></span></div>
      <span class="top-tag"><span></span> 카드뉴스 작업실</span>
    </div>
  </header>
  <main class="shell">
    <section class="intro">
      <div class="eyebrow"><svg><use href="#spark"/></svg> INSTAGRAM CAROUSEL STUDIO</div>
      <h1>한 줄의 아이디어를, <strong>카드뉴스로.</strong></h1>
      <p>주제를 입력하고 디자인을 골라 인스타그램에 올릴 카드뉴스를 만들어 보세요.</p>
    </section>
    <div class="workspace">
      <section class="panel settings" aria-labelledby="settings-title">
        <div class="panel-heading">
          <span class="section-icon"><svg><use href="#spark"/></svg></span>
          <div><h2 id="settings-title">카드뉴스 만들기</h2><p>주제와 디자인을 설정하세요.</p></div>
        </div>
        <form id="create-form">
          <div class="field topic-field">
            <label for="topic"><span class="step">01</span> 어떤 주제로 만들까요?</label>
            <div class="topic-box"><textarea id="topic" maxlength="80" rows="2" placeholder="예: 하루를 바꾸는 작은 습관" required></textarea><span id="topic-count" class="counter">0 / 80</span></div>
            <div class="suggestions" aria-label="추천 주제">
              <button type="button" data-topic="하루를 바꾸는 작은 습관">작은 습관</button>
              <button type="button" data-topic="초보자를 위한 커피 가이드">커피 가이드</button>
              <button type="button" data-topic="일상에서 실천하는 제로웨이스트">제로웨이스트</button>
            </div>
            <details class="key-points"><summary>담고 싶은 내용 추가 <span>선택</span></summary><label class="sr-only" for="points">담고 싶은 내용</label><textarea id="points" maxlength="480" rows="3" placeholder="카드에 넣을 핵심 내용을 줄마다 하나씩 입력하세요."></textarea></details>
          </div>
          <div class="field row-field">
            <div><label for="tone"><span class="step">02</span> 문체</label><select id="tone"><option value="friendly">친근하게</option><option value="informative">정보 전달형</option><option value="punchy">짧고 강하게</option></select></div>
            <div><label for="quantity"><span class="step">03</span> 카드 수</label><select id="quantity"><option value="3">3장</option><option value="4">4장</option><option value="5" selected>5장</option><option value="6">6장</option><option value="7">7장</option></select></div>
          </div>
          <fieldset class="field theme-field">
            <legend><span class="step">04</span> 디자인 테마</legend>
            <div class="theme-options" id="themes"></div>
          </fieldset>
          <button class="primary generate" type="submit"><svg><use href="#spark"/></svg> 카드뉴스 생성하기 <svg class="trailing"><use href="#arrow"/></svg></button>
          <p class="form-note">입력한 내용으로 편집 가능한 카드 초안을 만들어요.</p>
        </form>
      </section>
      <section class="panel preview" aria-labelledby="preview-title">
        <div class="panel-heading">
          <span class="section-icon"><svg><use href="#grid"/></svg></span>
          <div><h2 id="preview-title">미리보기</h2><p id="preview-description">샘플 카드뉴스를 확인해 보세요.</p></div>
          <span class="size-tag"><svg><use href="#square"/></svg> 1080 × 1080</span>
        </div>
        <div class="stage">
          <button id="prev" class="nav" type="button" aria-label="이전 카드"><svg><use href="#left"/></svg></button>
          <div class="card-wrap"><canvas id="card" width="1080" height="1080" role="img" aria-label="카드 미리보기"></canvas></div>
          <button id="next" class="nav" type="button" aria-label="다음 카드"><svg><use href="#right"/></svg></button>
        </div>
        <div class="filmstrip">
          <div id="thumbs" class="thumbs" aria-label="카드 선택"></div>
          <span id="position" class="position"></span>
        </div>
        <div class="actions">
          <button id="edit-card" class="secondary" type="button"><svg><use href="#edit"/></svg> 카드 편집</button>
          <div class="export-actions">
            <button id="download-card" class="secondary single-download" type="button" aria-label="현재 카드 PNG 저장" title="현재 카드 PNG 저장"><svg><use href="#download"/></svg> <span>PNG</span></button>
            <button id="download-all" class="primary export" type="button"><svg><use href="#download"/></svg> 전체 저장 <span>ZIP</span></button>
          </div>
        </div>
      </section>
    </div>
    <footer><span><svg><use href="#layers"/></svg> 슬라이드메이커</span><span>1080px 정사각형 카드 · Instagram 캐러셀용</span></footer>
  </main>
  <dialog id="editor">
    <form id="edit-form">
      <div class="dialog-title"><h2>카드 편집</h2><button id="close-editor" class="close" type="button" aria-label="닫기">×</button></div>
      <label for="edit-title">제목</label><textarea id="edit-title" maxlength="90" rows="2" required></textarea>
      <label for="edit-body">본문</label><textarea id="edit-body" maxlength="250" rows="4"></textarea>
      <div class="dialog-actions"><button id="cancel-editor" class="secondary" type="button">취소</button><button class="primary" type="submit">변경사항 저장</button></div>
    </form>
  </dialog>
  <div class="toast" id="status" role="status" aria-live="polite"></div>
</body>
</html>
